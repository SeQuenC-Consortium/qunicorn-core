---
apiVersion: v1
kind: ConfigMap
metadata:
  creationTimestamp: null
  name: nginx-config
data:
  default.conf: |+
    server {
        listen       8080;
        listen  [::]:8080;
        server_name  localhost;

        access_log  /var/log/nginx/host.access.log  main;

        # proxy qunicorn service/server
        location / {
            auth_basic           "???";
            auth_basic_user_file /etc/secrets/.htpasswd;

            proxy_set_header   Host \$http_host;
            proxy_set_header   X-Real-IP \$remote_addr;

            # override "Authorization $http_authorization" header
            # to prevent passing it to the qunicorn service
            proxy_set_header   Authorization "";
            proxy_pass_header  Authorization;

            # proxy passes to service/server
            proxy_pass   http://10.233.62.14:8081;
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: nginx-proxy
  name: nginx-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx-proxy
  strategy: {}
  template:
    metadata:
      labels:
        app: nginx-proxy
    spec:
      containers:
      - image: nginx:latest
        name: nginx
        volumeMounts:
          - mountPath: /etc/nginx/conf.d/default.conf
            name: nginx-conf
            subPath: default.conf
          - mountPath: /etc/secrets
            name: basic-auth
            readOnly: true
      volumes:
        - configMap:
            defaultMode: 420
            items:
              - key: default.conf
                path: default.conf
            name: nginx-config
          name: nginx-conf
        - secret:
            secretName: basic-auth-qunicorn
          name: basic-auth
